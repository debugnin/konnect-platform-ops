_format_version: "3.0"

# ---------------------------------------------------------------------------
# Local DB-less Kong Gateway config for verifying three error-reshape
# examples (jq, datakit, response-transformer-advanced), each on its own
# Service/Route. Upstream is the public httpbin.konghq.com test service,
# matching the committed standalone examples one level up
# (../jq-error-transform.yaml, ../datakit-error-transform.yaml,
# ../response-transformer-advanced-error-transform.yaml).
#
# httpbin.konghq.com doesn't return a JSON:API-shaped error body, so these
# routes verify PLUGIN WIRING and PASS-THROUGH behavior (each plugin leaves
# a normal httpbin response untouched since there's no top-level "errors"
# array to match on) rather than the full error-reshape end-to-end. See
# README.md in this directory for exactly what each curl command proves,
# and how to point these at a real/mock JSON:API-style upstream if you want
# to see the full transform fire.
# ---------------------------------------------------------------------------

services:
  # ---- jq -----------------------------------------------------------------
  - name: jq-example-service
    url: https://httpbin.konghq.com
    tags:
      - example-jq
    routes:
      - name: jq-example-route
        paths:
          - /jq-error-transform-example
        strip_path: true
        tags:
          - example-jq
    plugins:
      - name: jq
        tags:
          - example-jq
        config:
          response_if_media_type:
            - application/json
            - application/vnd.api+json
          response_if_status_code:
            - 404
          response_jq_program: |
            (.errors[0] // {}) as $err
            | {
                errorCode: $err.status,
                errorDetail: $err.detail
              }

  # ---- Datakit --------------------------------------------------------------
  - name: datakit-example-service
    url: https://httpbin.konghq.com
    tags:
      - example-datakit
    routes:
      - name: datakit-example-route
        paths:
          - /datakit-error-transform-example
        strip_path: true
        tags:
          - example-datakit
    plugins:
      - name: datakit
        tags:
          - example-datakit
        config:
          nodes:
            # KNOWN LIMITATION (confirmed via live testing against this exact
            # control plane / data plane): any node that declares a dependency
            # on service_response.body OR service_response.raw_body causes
            # Datakit's implicit `service_response` node to eagerly call
            # kong.service.response.get_body() for the WHOLE request -- even
            # if that node is gated behind a `branch` and never scheduled to
            # run. If the upstream Content-Type isn't JSON/form/multipart
            # (e.g. a plain 404 with text/html), this throws a hard 500:
            #   node service_response failed with error: "failed reading
            #   service response body: unsupported content type 'text/html;
            #   charset=utf-8'"
            # service_response.headers and service_response.status do NOT
            # trigger this, so a Content-Type guard can be used to avoid
            # *acting* on a bad body, but it cannot prevent the eager-read
            # crash once a body-dependent node exists anywhere in the graph.
            # See README.md for the full write-up and mitigation options.
            - name: RESHAPE_ERROR
              type: jq
              inputs:
                body: service_response.body
                headers: request.headers
              output: response.body
              jq: |
                if (.body.errors != null) then
                  (.headers | with_entries(.key |= ascii_downcase)) as $h
                  | (.body.errors[0] // {}) as $err
                  | {
                      errorCode: $err.status,
                      errorDetail: $err.detail,
                      correlationId: ($h["x-correlation-id"] // null)
                    }
                else
                  .body
                end

  # ---- response-transformer-advanced (Lua) ---------------------------------
  - name: response-transformer-advanced-example-service
    url: https://httpbin.konghq.com
    tags:
      - example-response-transformer-advanced
    routes:
      - name: response-transformer-advanced-example-route
        paths:
          - /response-transformer-advanced-error-transform-example
        strip_path: true
        tags:
          - example-response-transformer-advanced
    plugins:
      - name: response-transformer-advanced
        tags:
          - example-response-transformer-advanced
        config:
          transform:
            functions:
              - |
                return function (data)
                  if type(data) ~= "table" or type(data.errors) ~= "table" then
                    return data
                  end

                  local err = data.errors[1] or {}
                  local correlation_id = kong.request.get_header("X-Correlation-Id")
                                       or kong.request.get_id()

                  return {
                    errorCode = err.status,
                    errorDetail = err.detail,
                    correlationId = correlation_id,
                  }
                end
